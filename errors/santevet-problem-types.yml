gaps:
- >-
  Neither OpenAPI document declares a 401 or 403 response on any operation, yet every operation
  returns 401 anonymously. An agent reading the spec would not know the API requires auth.
- >-
  The reimbursement API declares no 4xx response at all on createReimbursement,
  updateReimbursement or findSchedule.
- >-
  No error type registry, no machine-readable error code catalogue, and no stable error
  identifiers exist on any of the three APIs.
