note: >-
  The toolkit API (API Platform / Symfony) returns a genuine RFC 7807 problem document with
  type/title/detail on content-negotiation failure, and a Hydra error document
  (@context /contexts/Error, @type hydra:Error, hydra:title, hydra:description) for
  application/ld+json. It advertises application/problem+json in its Accept handling but does
  NOT list problem+json among its supported response MIME types, so the envelope a caller gets
  depends on the negotiated format. The reimbursement API returns a flat {"message": "..."}
  envelope. The acquisition API documents status codes in HTML but publishes no error schema.
  Three different error envelopes across three APIs is the finding, not a defect to paper over.
