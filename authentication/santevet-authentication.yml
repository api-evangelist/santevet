upgrades: derived baseline from 0-working/derive-authentication.py, which saw only the one declared scheme
note: >-
  One credential, three APIs, and only one of them admits it. The toolkit API declares an apiKey
  scheme in the Authorization header and applies it as a root-level security requirement across
  all 58 operations. The reimbursement and acquisition APIs declare NO securityScheme and NO
  security requirement at all, yet both reject every anonymous request with 401. No operation on
  any of the three declares a 401 or 403 response, so an agent reading these contracts would
  conclude they are open. That gap is the most consequential authentication finding here.
