authorization_model:
  scopes: false
  roles: false
  tenancy: >-
    Probably brand-scoped in practice — ref_id_marque (the SvMarque foreign key) threads through
    the acquisition, toolkit and distribution models and is the natural partner boundary — but
    SantéVet publishes no statement of what a partner key is authorised to see or do.
  note: >-
    A single opaque header credential with no scopes, no roles and no documented tenancy is the
    weakest authorization posture in this estate. A partner key that can read
    /clients/{clientId}/reimbursements has no published constraint limiting it to that partner's
    own clients.
gaps:
- Two of three APIs declare no securityScheme despite enforcing authentication.
- No operation on any API declares a 401 or 403 response.
- The acquisition API's published meaning for 401 contradicts its runtime behaviour.
- No scopes, no roles, no documented tenancy boundary.
- No documented key rotation, expiry, revocation or rate-limit-per-key policy.
- No HSTS on the API hosts (see security/santevet-domain-security.yml).
