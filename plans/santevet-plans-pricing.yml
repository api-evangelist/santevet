underlying_product_pricing:
  note: >-
    Distinct from API pricing, and recorded because it explains the shape of the API. SantéVet
    deliberately publishes no consumer price grid — a pet-insurance premium is computed per
    animal from breed, age and postal code, and is only obtainable by requesting a quote. That
    rating engine IS the acquisition API: GET /rates takes postal_code, breed, father_breed,
    mother_breed and birth_date and returns rates and options. The absence of a public price
    list and the existence of a partner rating API are the same business decision.
