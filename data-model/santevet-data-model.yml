dangling_references:
  note: >-
    These id fields are declared on reimbursement DTOs but resolve to no operation in any
    published SantéVet contract. An agent handed a reimbursement cannot follow any of them.
  fields:
  - field: contract_id
    on: [ApiReimbursement, ApiReimbursement2, ApiReimbursement3, CreateReimbursementClaimRequest, CreateThirdPartyPaymentRequest, CreateLossQuotationRequest, CreateDeathRegistrationRequest]
    resolves_to: no published operation
  - field: coverage_id
    on: [ApiReimbursement]
    resolves_to: >-
      partially — usable as the path parameter of
      GET /api/v1/third-party-payments/{coverageId}/schedule, but no coverage resource exists
  - field: clinic_id
    on: [ApiReimbursement, ApiReimbursement2, ApiReimbursement3, UpdateThirdPartyPaymentRequest, CreateReimbursementClaimRequest, CreateThirdPartyPaymentRequest]
    resolves_to: no published operation (ApiClinic appears only nested in responses)
  - field: veterinary_id
    on: [ApiReimbursement, ApiReimbursement2, ApiReimbursement3, UpdateThirdPartyPaymentRequest, CreateReimbursementClaimRequest]
    resolves_to: no published operation
  - field: origin_id
    on: [ApiReimbursement, ApiReimbursement2, ApiReimbursement3, CreateReimbursementClaimRequest, CreateThirdPartyPaymentRequest, CreateLossQuotationRequest, CreateDeathRegistrationRequest]
    resolves_to: >-
      probably toolkit OrigineCommerciale (/commercial-origins), but the binding is undocumented
  - field: sinister_notification_id
    on: [ApiReimbursement, ApiReimbursement2, ApiReimbursement3]
    resolves_to: no published operation
  - field: correspondence_id
    on: [ApiReimbursement]
    resolves_to: no published operation
  - field: animal_id
    on: [ApiReimbursement3]
    resolves_to: >-
      usable as the path parameter of GET /api/v1/animals/{animalId}/reimbursements, but no
      animal resource is exposed by the reimbursement API
  - field: clientId
    on: 'path parameter of findAllReimbursementsByClient'
    resolves_to: no client/customer resource is published by any SantéVet API
cross_api_joins:
  note: >-
    The estate's real integration seams. Each is inferred from naming and type agreement, not
    from a documented link — no SantéVet contract states any of them.
  joins:
  - from: 'acquisition Animal.breed / father_breed / mother_breed (integer)'
    to: 'toolkit Race.id (/breeds/{id})'
    confidence: high
    basis: integer breed identifiers with no local enumeration; toolkit is the breed registry
  - from: 'acquisition Prospect.ref_id_marque (integer)'
    to: 'toolkit SvMarque (via /commercial-origins, /telephone-numbers)'
    confidence: high
    basis: identical field name ref_id_marque used as the SvMarque foreign key across toolkit
  - from: 'acquisition Prospect.postal_code'
    to: toolkit SvGroupeCodePostal
    confidence: medium
    basis: postal code is a declared rating input on GET /rates and toolkit models postal-code rating groups
  - from: 'reimbursement origin_id'
    to: 'toolkit OrigineCommerciale.id (/commercial-origins/{id})'
    confidence: medium
    basis: name agreement (origine commerciale) and integer type
  - from: 'reimbursement ApiTypology / claim classification'
    to: 'toolkit TypeSinistre (/claims/types), MotifNonRemboursement (/claims/no-refund-reasons)'
    confidence: medium
    basis: toolkit publishes the claim-type and no-refund-reason enumerations the claims domain needs
identifier_conventions:
  style: opaque integers, no prefixes
  note: >-
    Every identifier in the estate is a bare auto-increment integer except the acquisition
    quotation uniqueId (40-60 char alphanumeric). No type-prefixed identifiers anywhere, so an
    id carries no information about what it identifies and cannot be validated client-side.
