method: derived
source: >-
  openapi/santevet-toolkit-openapi.yml (components.schemas $ref graph),
  openapi/santevet-reimbursement-openapi.yml (components.schemas id-reference fields),
  acquisition.api.santevet.com/api/doc (documented parameter tree)
note: >-
  Three APIs, three disconnected models, joined only by shared integer identifiers that no
  single API resolves. The toolkit API publishes a fully $ref-linked reference-data graph
  (40 base entities). The reimbursement API publishes flat DTOs whose eight *_id fields point at
  entities it does not expose. The acquisition API publishes a nested write tree
  (prospect -> animals) with no read model for the entities it creates. Naming is mixed
  French/English throughout: Race means breed, Espece means species, Marque means brand,
  Sinistre means claim, Fractionnement means payment instalment plan.
domains:
- name: reference-data
  api: toolkit
  base: https://toolkit.api.santevet.com
  entity_count: 40
  note: >-
    Read-mostly catalogue that every other SantéVet surface depends on for its enumerations —
    breeds, species, countries, languages, claim types, cancellation reasons, payment types,
    promotional codes and the rate/formula definitions.
- name: acquisition
  api: acquisition
  base: https://acquisition.api.santevet.com
  entity_count: 4
  note: Prospect, Quotation, Rate, Status. Write-oriented quote-to-subscribe funnel.
- name: claims-and-reimbursement
  api: reimbursement
  base: https://reimbursement.api.santevet.com
  entity_count: 12
  note: >-
    Reimbursement claims, third-party-payment (tiers payant) schedules, clinics, veterinary
    acts and coverage upper limits.
entities:
- name: SvMarque
  label: Brand
  api: toolkit
  role: hub
  note: >-
    The most connected entity in the estate — five outbound has_many edges. SantéVet's
    white-label/partner distribution model is expressed as a brand, which is why partner
    integrations start by resolving ref_id_marque.
