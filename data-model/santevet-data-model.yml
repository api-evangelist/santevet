- name: Prospect
  label: Prospect
  api: acquisition
  paths: ['/prospects', '/prospects/{id}', '/prospects/anonymize']
  identifier: integer id (\d+)
  fields:
  - ref_id_marque
  - name
  - married_name
  - first_name
  - birth_date
  - street_number
  - adress_1
