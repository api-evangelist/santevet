apis:
- aid: santevet-acquisition
  name: SantéVet Acquisition API
  description: >-
    SantéVet's partner quote-to-subscribe funnel and rating engine. Creates and updates prospects (with
    a dedicated GDPR anonymisation operation), creates, searches, validates and subscribes quotations,
    and exposes GET /rates — the rating engine that turns a postal code, breed and animal date of birth
    into premiums and cover options. This is the pricing surface for a company that deliberately publishes
    no consumer price grid. 14 operations across Prospect, Quotation, Rate and Status.
  humanURL: https://acquisition.api.santevet.com/api/doc
  baseURL: https://acquisition.api.santevet.com
  tags:
  - Quotes
  - Rating
  - Subscription
  - Insurance
  - Pet Insurance
  properties:
  - type: APIReference
    url: https://acquisition.api.santevet.com/api/doc
  - type: Sandbox
    url: https://acquisition.api.santevet.com/api/doc
  x-note: >-
    Documented only as a NelmioApiDocBundle 2.x HTML reference with an interactive sandbox — no machine-readable
    specification is published, so no OpenAPI pointer is wired. The HTML publishes all 14 operations with
    their parameters, requirements and status codes. No OpenAPI document was authored from it: deriving
    a specification from HTML would put a non-provider-authored contract in openapi/.
