x-pointers-deliberately-not-emitted:
  note: >-
    Recorded so a reader can tell an absent pointer from an unchecked one. Each of these was
    probed or searched, missed, and is therefore NOT wired — emitting any of them would credit
    SantéVet with a surface it does not publish.
  MCPServer: >-
    No MCP server in any form — no hosted endpoint, no stdio package, no registry entry. The
    derived candidate tool list in mcp/santevet-mcp.yml carries deployment.mode = none.
  AgentCard: >-
    /.well-known/agent-card.json and /.well-known/agent.json return 404 on every real host. Four
    hosts answer 200 with an SPA HTML shell for every path; those are rejected as false
    positives. Nothing written to a2a/.
  WellKnown: Every /.well-known/ path returned 404 on all 16 hosts probed.
  SecurityTxt: /.well-known/security.txt returns 404 on all 16 hosts probed.
  Security: No vulnerability-disclosure programme, policy page or bug bounty found.
  VulnerabilityDisclosure: Same — probe-security-programs.py recorded no hit.
  TrustCenter: trust.santevet.com and security.santevet.com are both NXDOMAIN.
  Compliance: No published certification programme or named audit (SOC 2, ISO 27001, PCI DSS).
  Idempotency: >-
    Zero occurrences of "idempoten" across 218KB of specification. No write operation publishes a
    deduplication contract.
  SDKs: No first-party client library on npm, PyPI, RubyGems or Packagist.
  StatusPage: status.santevet.com is NXDOMAIN; the acquisition /status endpoint is 401-gated.
  Deprecation: No deprecation policy, no Sunset or Deprecation header, zero deprecated operations.
  AsyncAPI: No AsyncAPI document published.
  Webhooks: >-
    No documented webhook catalogue. webcallback.api.santevet.com exists and returns 404 at its
    root; an event surface is implied but nothing is published.
  OAuthScopes: No oauth2 scheme and zero scopes; derive-oauth-scopes.py found nothing.
  ChangeLog: No dated changelog on any host.
  CLI: No first-party CLI.
  Postman: No public Postman collection or workspace found.
  DeveloperPortal: >-
    None exists. The three /api/doc endpoints are per-service references, wired as APIReference on
    their own api entries; there is no portal that indexes them.
  GettingStarted: No quickstart or getting-started page.
  Roadmap: No public roadmap.
  Pricing: >-
    No API rate card and no consumer price grid — SantéVet quotes per animal by design. See
    plans/santevet-plans-pricing.yml (plan_count 0).
  GitHubOrganization: >-
    github.com/santevet exists but publishes zero repositories, sets no display name and no
    website, so it cannot be attributed to this company.
  Blog: >-
    /articles/<slug> pages exist, but no verified blog index or feed URL was reachable before the
    marketing host began refusing connections from this run.
  ToolCrosswalk: Precondition not met — no MCP server and no GraphQL surface to cross-walk.
x-image-note: >-
  image is intentionally unset. https://www.santevet.com and the .be/.es/.it/.de sites stopped
  completing TLS connections from this run partway through the pass (an edge throttle on the
  marketing CDN), so no logo or og:image URL could be verified. Left blank rather than guessed.
