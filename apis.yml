aid: santevet
name: SantéVet
description: >-
  SantéVet is a French pet-insurance company, founded in 2003 and headquartered in Lyon, that
  insures dogs, cats and small pets (NAC) across five European markets — France, Belgium, Spain,
  Italy and Germany. Alongside its direct-to-consumer business it runs a B2B distribution
  network: brokers, retailers, affinity partners and veterinary practices embed SantéVet quoting,
  subscription and claims into their own channels over HTTP APIs. Three of those partner APIs
  serve documentation anonymously — a reference-data Toolkit API (58 operations, API Platform,
  Hydra/JSON-LD), a Reimbursement API behind the PayVet third-party-payment product (6
  operations, OpenAPI 3.0.3), and an Acquisition API carrying the quote-to-subscribe funnel and
  the rating engine (14 operations, HTML reference only). SantéVet publishes no developer portal,
  no SDK, no pricing and no self-serve signup; credentials are issued through a sales process.
url: https://raw.githubusercontent.com/api-evangelist/santevet/refs/heads/main/apis.yml
