apis:
- aid: santevet-toolkit
  name: SantéVet Toolkit API
  description: >-
    SantéVet's partner reference-data API and the registry every other SantéVet surface depends
    on. Publishes species, breeds and breed groups; insurance contract definitions, cover options
    and rate rows; promotional codes; premium instalment plans (fractionnement); claim types,
    no-refund reasons and claim return reasons; commercial origins, brands, telephone numbers,
    partner types, countries and languages. 58 operations, 54 of them reads, over 40 base
    entities. API Platform implementation with Hydra/JSON-LD content negotiation and a rich
    filter grammar. Requires a partner API key in the Authorization header.
  humanURL: https://toolkit.api.santevet.com/docs
  baseURL: https://toolkit.api.santevet.com
  tags:
  - Reference Data
  - Insurance
  - Pet Insurance
  - Breeds
  - Rates
  - JSON-LD
  properties:
  - type: OpenAPI
    url: openapi/santevet-toolkit-openapi.yml
  - type: APIReference
    url: https://toolkit.api.santevet.com/docs
  - type: JSONLDContext
    url: json-ld/santevet-toolkit-hydra-docs.jsonld
  - type: Overlay
    url: overlays/santevet-toolkit-overlay.yaml
  x-note: >-
    The published document declares an empty info.title, the framework-default info.version
    0.0.0, and a single relative server "/". The harvested spec is left verbatim; the absolute
    production host and the real identity are recorded in the Overlay rather than written into
    the contract.
- aid: santevet-reimbursement
  name: SantéVet Reimbursement API
  description: >-
    SantéVet's partner claims and settlement API. Creates and retrieves pet-insurance
    reimbursement claims, lists every claim for an insured animal or for a client, and returns
    the third-party-payment (tiers payant) instalment schedule for a coverage — the surface
    behind PayVet, where SantéVet settles directly with the veterinary clinic instead of
    reimbursing the owner afterwards. 6 operations under /api/v1/, 19 component schemas.
    The best-formed of SantéVet's three contracts, though it declares no security scheme despite
    returning 401 on every operation.
  humanURL: https://reimbursement.api.santevet.com/api/doc
  baseURL: https://reimbursement.api.santevet.com
  tags:
  - Claims
  - Reimbursement
  - Insurance
  - Payments
  - Veterinary
  properties:
  - type: OpenAPI
    url: openapi/santevet-reimbursement-openapi.yml
  - type: APIReference
    url: https://reimbursement.api.santevet.com/api/doc
  - type: Overlay
    url: overlays/santevet-reimbursement-overlay.yaml
  - type: Sandbox
    url: https://reimbursement.api.santevet.com/api/doc
- aid: santevet-acquisition
  name: SantéVet Acquisition API
  description: >-
    SantéVet's partner quote-to-subscribe funnel and rating engine. Creates and updates prospects
    (with a dedicated GDPR anonymisation operation), creates, searches, validates and subscribes
    quotations, and exposes GET /rates — the rating engine that turns a postal code, breed and
    animal date of birth into premiums and cover options. This is the pricing surface for a
    company that deliberately publishes no consumer price grid. 14 operations across Prospect,
    Quotation, Rate and Status.
  humanURL: https://acquisition.api.santevet.com/api/doc
  baseURL: https://acquisition.api.santevet.com
  tags:
  - Quotes
  - Rating
  - Subscription
  - Insurance
  - Pet Insurance
  properties:
  - type: APIReference
    url: https://acquisition.api.santevet.com/api/doc
  - type: Sandbox
    url: https://acquisition.api.santevet.com/api/doc
  x-note: >-
    Documented only as a NelmioApiDocBundle 2.x HTML reference with an interactive sandbox — no
    machine-readable specification is published, so no OpenAPI pointer is wired. The HTML
    publishes all 14 operations with their parameters, requirements and status codes. No OpenAPI
    document was authored from it: deriving a specification from HTML would put a
    non-provider-authored contract in openapi/.
