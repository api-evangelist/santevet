actions:
- target: $.info
  description: >-
    The document has a real title, version and developer contact — the best-formed of SantéVet's
    three contracts. Adding the description it lacks.
  update:
    description: >-
      SantéVet's partner claims and reimbursement API. Creates and retrieves pet-insurance
      reimbursement claims, lists a client's or an animal's claims, and retrieves the
      third-party-payment (tiers payant) instalment schedule for a coverage — the API behind
      SantéVet's PayVet product, where the insurer settles directly with the veterinary clinic
      instead of reimbursing the owner afterwards. Six operations. Requires partner credentials.
- target: $.components.securitySchemes
  description: >-
    THE MOST IMPORTANT CORRECTION IN THIS OVERLAY. The document declares NO securitySchemes and
    NO security requirement, yet every operation returns 401 "User authentication required"
    anonymously. An agent reading this specification would conclude the API is open. Recording
    the observed scheme, matching the sibling toolkit API's declared apiKey scheme.
  update:
    x-apievangelist-observed-apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        OBSERVED, NOT DECLARED. Partner API key in the Authorization header, consistent with the
        apiKey scheme the SantéVet Toolkit API declares. Verified by
        GET https://reimbursement.api.santevet.com/api/v1/reimbursements/1 returning HTTP 401
        with body {"message":"User authentication required"}.
