          type:
          - string
          - 'null'
        visit_reason:
          title: The visit reason
          type:
          - string
          - 'null'
        clinic_id:
          title: The id of the clinic
          type:
          - integer
          - 'null'
        veterinary_id:
          title: The id of the veterinary
          type:
          - integer
          - 'null'
        updated_clinic_amount:
          title: The amount
          type:
          - number
          - 'null'
