          type: integer
        contract_id:
          description: The contract identifier
          type: integer
        origin_id:
          description: 'The origin identifier<br/> `1`: Mobile application, `2`: Veterinary area, `3`: Veterinary software, `4`: Client area, `5`: Paper'
          type: integer
        file_path:
          description: The file path
          type:
